version: 2

# GoReleaser configuration for kat
before:
  hooks:
    - go mod download
    - go mod tidy
    - git-cliff --latest --tag {{ .Tag }} --prepend CHANGELOG.md

report_sizes: true

builds:
  - main: ./cmd/kat/
    id: "kat"
    binary: kat
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - linux
      - darwin

      # need help with testing on windows to ensure this works
      # - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/BolajiOlajide/kat/internal/version.version={{.Version}}

archives:
  - formats: [tar.gz]
    wrap_in_directory: false
    name_template: >-
      kat_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"

dockers_v2:
  - id: kat
    ids:
      - kat
    dockerfile: Dockerfile
    images:
      - "docker.io/cooproton12/kat"
    tags:
      - "v{{ .Version }}"
      - latest
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/BolajiOlajide/kat"
      "org.opencontainers.image.licenses": "MIT"
    platforms:
      - linux/amd64
      - linux/arm64

changelog:
  disable: true

signs:
  - artifacts: checksum
    cmd: gpg2
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  github:
    owner: BolajiOlajide
    name: kat
  draft: true
  replace_existing_draft: true
  mode: append
  # Header for the release body.
  #
  # Templates: allowed.
  header: |
    ## Kat ({{ .Version }})

    Welcome to this new release!
